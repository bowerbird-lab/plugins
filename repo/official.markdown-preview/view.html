<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.65;
      background: transparent;
    }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { padding: 12px; border-radius: 8px; overflow-x: auto; background: rgba(128,128,128,0.12); }
    blockquote { margin: 0; padding-left: 12px; border-left: 3px solid rgba(128,128,128,0.4); opacity: 0.85; }
    img { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app">Loading Markdown...</div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const src = (window.__BOWERBIRD_ITEM__ && window.__BOWERBIRD_ITEM__.url) || params.get("url");
      const root = document.getElementById("app");
      if (!src) { root.textContent = "No markdown source provided."; return; }
      try {
        const res = await fetch(src);
        const text = await res.text();
        // Lightweight zero-dependency Markdown -> HTML renderer
        const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
        const html = esc(text)
          .replace(/^### (.*)$/gm, "<h3>$1</h3>")
          .replace(/^## (.*)$/gm, "<h2>$1</h2>")
          .replace(/^# (.*)$/gm, "<h1>$1</h1>")
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\n\n/g, "<br/><br/>");
        root.innerHTML = html;
      } catch (e) {
        root.textContent = "Failed to load markdown: " + e.message;
      }
    })();
  </script>
</body>
</html>
