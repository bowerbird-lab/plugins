<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mage AI Image Studio</title><link rel="stylesheet" href="style.css"><script defer src="studio.js"></script></head>
<body><header><strong>Mage AI Image Studio</strong><span id="balance"></span></header><main><section class="canvas"><div class="images"><article><h3>原图</h3><div class="image"><img id="source" alt="原图"><span id="source-empty">打开窗口前请在主界面选择图片</span></div><p id="source-name"></p></article><article><h3>修改结果</h3><div class="image"><img id="result" alt="生成结果"><span id="result-empty">生成结果将在这里显示</span></div></article></div><div class="actions"><button id="save-new" disabled>保存为新素材</button><button id="replace" disabled>替换原图（保留历史版本）</button></div></section><aside><label>模型<select id="model"></select></label><label>自定义架构 ID<input id="architecture" placeholder="可选，例如 minimax_h3_image"></label><label>自定义模型 ID<input id="model-id" placeholder="可选，留空使用默认模型"></label><label>宽高比<select id="ratio"><option value="">默认 / 自动</option><option>1:1</option><option>4:5</option><option>2:3</option><option>3:2</option><option>16:9</option><option>9:16</option></select></label><label>随机种子<input id="seed" type="number" placeholder="留空则随机"></label><label>修改提示词<textarea id="prompt" placeholder="描述你希望如何修改这张图片"></textarea></label><button id="run" class="primary">运行修改</button><button id="cancel" disabled>取消</button><p id="status" role="status"></p><p class="hint">请在 Bowerbird 插件设置中填写 API Key，并允许联网、读取和写入素材。打开窗口前选择图片。</p></aside></main></body></html>
