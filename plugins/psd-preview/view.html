<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSD Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    canvas, img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px; }
    #status { opacity: 0.75; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <img id="preview" alt="PSD Preview" />
  <div id="status">Loading PSD preview...</div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const item = window.__BOWERBIRD_ITEM__ || {};
      const thumb = item.thumbUrl || params.get("thumbUrl") || item.url || params.get("url");
      const img = document.getElementById("preview");
      const status = document.getElementById("status");
      if (!thumb) { status.textContent = "No PSD source provided."; return; }
      img.onload = () => { status.textContent = item.filename || "PSD Preview"; };
      img.onerror = () => { status.textContent = "Unable to render PSD preview."; };
      img.src = thumb;
    })();
  </script>
</body>
</html>
