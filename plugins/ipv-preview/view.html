<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPV Preview</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      cursor: grab; touch-action: none;
      background-image:
        linear-gradient(45deg, rgba(128,128,128,.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(128,128,128,.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(128,128,128,.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.08) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }
    #stage.dragging { cursor: grabbing; }
    img { max-width: 94vw; max-height: 92vh; object-fit: contain; transform-origin: center center; user-select: none; -webkit-user-drag: none; }
    #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); opacity: 0.75; font-size: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"><img id="preview" alt="IPV Preview" /></div>
  <div id="status">Loading IPV preview...</div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const item = window.__BOWERBIRD_ITEM__ || {};
      const thumb = item.thumbUrl || params.get("thumbUrl") || item.url || params.get("url");
      const stage = document.getElementById("stage");
      const img = document.getElementById("preview");
      const status = document.getElementById("status");
      if (!thumb) { status.textContent = "No IPV source provided."; return; }
      let zoom = 1, panX = 0, panY = 0, dragging = false, lastX = 0, lastY = 0;
      const apply = () => {
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      };
      stage.addEventListener("wheel", (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          zoom = Math.min(16, Math.max(0.1, zoom * (1 - e.deltaY * 0.005)));
        } else {
          panX -= e.deltaX;
          panY -= e.deltaY;
        }
        apply();
      }, { passive: false });
      stage.addEventListener("pointerdown", (e) => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        panX += e.clientX - lastX; panY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        apply();
      });
      stage.addEventListener("pointerup", () => { dragging = false; stage.classList.remove("dragging"); });
      stage.addEventListener("dblclick", () => { zoom = 1; panX = 0; panY = 0; apply(); });
      img.onload = () => { status.textContent = item.filename || ""; };
      img.onerror = () => { status.textContent = "Unable to render IPV preview."; };
      img.src = thumb;
    })();
  </script>
</body>
</html>
