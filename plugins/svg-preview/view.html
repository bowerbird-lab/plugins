<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Preview</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 16px;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; box-sizing: border-box;
      background-image: linear-gradient(45deg, rgba(128,128,128,.08) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(128,128,128,.08) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(128,128,128,.08) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(128,128,128,.08) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }
    img, svg { max-width: 100%; max-height: 90vh; object-fit: contain; }
  </style>
</head>
<body>
  <div id="root">Loading SVG...</div>
  <script>
    (async function () {
      const params = new URLSearchParams(location.search);
      const item = window.__BOWERBIRD_ITEM__ || {};
      const src = item.url || params.get("url");
      const root = document.getElementById("root");
      if (!src) { root.textContent = "No SVG source provided."; return; }
      try {
        const res = await fetch(src);
        const text = await res.text();
        root.innerHTML = text;
      } catch (e) {
        root.textContent = "Failed to load SVG: " + e.message;
      }
    })();
  </script>
</body>
</html>
